spring.application.name=worksphere

spring.data.mongodb.uri=${DB_URL}
spring.data.mongodb.database=WorkSphere

# JWT Secret Key (must be Base64 encoded, min 256 bits)
jwt.secret=${SECRET_KEY}
jwt.expiration=${EXP_TIME}
# 1800000ms = 30 minutes

# Attendance rules
attendance.standard-hours=8
attendance.half-day-hours=4
attendance.work-start-time=10:00
attendance.grace-period-minutes=15

#Jackson Timezone
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Your Mail trap Credentials
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=${PORT}
spring.mail.username=${USERNAME}
spring.mail.password=${PASSWORD}

# Technical Settings (The "tls = yes" part)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sender email
spring.mail.from=${EMAIL}

